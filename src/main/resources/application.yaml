spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/agentrnd?serverTimezone=Asia/Seoul
    username: root
    password: aivle

  jpa:
    hibernate:
      ddl-auto: validate
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
        implicit-strategy: org.hibernate.boot.model.naming.ImplicitNamingStrategyLegacyJpaImpl
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

  servlet:
    multipart:
      max-file-size: 1GB
      max-request-size: 1GB

  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2s

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

# =========================
# FastAPI 연동 (추가)
# =========================
fastapi:
  base-url: http://localhost:8000

# =========================
# JWT 설정
# =========================
jwt:
  secret: agent-rnd-jwt-secret-key-32bytes-minimum!!

# =========================
# 서버 설정
# =========================
server:
  tomcat:
    connection-timeout: 600000
    keep-alive-timeout: 600000
    max-swallow-size: -1

  error:
    include-message: always
    include-binding-errors: always

# =========================
# 외부 API
# =========================
external:
  data-go:
    service-key: 17986d31ec5f9cf3a864ffc5d8cf4420667bfffb4fc4decc025b895f9d2ab2d0
    base-url: https://api.odcloud.kr/api/nts-businessman/v1

# =========================
# 이메일 인증 정책
# =========================
auth:
  email:
    code-ttl-seconds: 300
    verified-ttl-seconds: 3600
    max-attempts: 5

