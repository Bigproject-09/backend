spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/agentrnd14?serverTimezone=Asia/Seoul
    username: root
    password: aivle

  jpa:
    hibernate:
      # DB와 엔티티 구조가 일치하는지 검사만 수행
      ddl-auto: validate

      # [중요] 자바 필드명 대소문자 그대로 DB 컬럼명을 찾게 하는 설정
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
        implicit-strategy: org.hibernate.boot.model.naming.ImplicitNamingStrategyLegacyJpaImpl
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

  # =========================
  # [필수] 대용량 파일 업로드 설정 (추가됨)
  # =========================
  servlet:
    multipart:
      max-file-size: 1GB       # 파일 1개당 최대 1GB
      max-request-size: 1GB    # 요청 전체 최대 1GB

  # =========================
  # Redis 설정 (들여쓰기 수정됨)
  # =========================
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2s

  # =========================
  # 이메일 설정 (들여쓰기 수정됨)
  # =========================
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

# =========================
# 포트원 결제 설정 (여기를 꼭 채워주기) 💳
