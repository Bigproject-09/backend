# =========================
# 서버 설정 (타임아웃 & 에러)
# =========================
server:
  # 대용량 처리를 위한 타임아웃 (10분)
  tomcat:
    connection-timeout: 600000
    keep-alive-timeout: 600000
    max-swallow-size: -1

  error:
    include-message: always
    include-binding-errors: always

# =========================
